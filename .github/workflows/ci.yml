name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify
        env:
          VITE_METRIKA_ID: ${{ vars.VITE_METRIKA_ID }}
          VITE_YANDEX_VERIFICATION: ${{ vars.VITE_YANDEX_VERIFICATION }}
          VITE_SITE_URL: ${{ vars.VITE_SITE_URL }}
          VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH }}
